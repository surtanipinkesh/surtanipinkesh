<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papad Pixels TV</title>
<meta name="description" content="Papad Pixels on the big screen: AI video ads, UGC and social videos, plus AI news, built for a TV remote.">
<!-- TV-only view of the portfolio: keep it out of search so it never competes with /portfolio -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#18160f">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
@font-face{ font-family:'Orbitron'; font-style:normal; font-weight:400 900; font-display:swap;
  src:url(../assets/fonts/orbitron-var-latin.woff2) format('woff2'); }
@font-face{ font-family:'Space Grotesk'; font-style:normal; font-weight:300 700; font-display:swap;
  src:url(../assets/fonts/space-grotesk-var-latin.woff2) format('woff2'); }
@font-face{ font-family:'Square Sans Serif 7'; font-style:normal; font-weight:400; font-display:swap;
  src:url(../assets/fonts/square-sans-serif-7.woff2) format('woff2'); }

:root{
  --bg:#18160f; --navy:#24334c; --panel:#1e1b15;
  --gold:#e0af3b; --gold-bright:#f0c568; --papad:#e9cd79; --tan:#d3a46e;
  --text:#f3f0e8; --text-dim:#a79c8a; --on-accent:#243552;
  --font-display:'Orbitron', sans-serif; --font-body:'Space Grotesk', sans-serif;
  --font-square:'Square Sans Serif 7', var(--font-display);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:var(--font-body); cursor:none; }

/* Everything is laid out on a fixed 1920x1080 stage and scaled to the screen,
   so it looks the same on a 720p browser viewport and a 4K panel. */
#stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; }

/* ---------- hero ---------- */
#hero{ position:absolute; inset:0; height:1080px; }
#heroVideo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#hero::after{ content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(24,22,15,.92) 0%, rgba(24,22,15,.55) 45%, rgba(24,22,15,0) 75%),
             linear-gradient(0deg, var(--bg) 8%, rgba(24,22,15,0) 55%); }

#topbar{ position:absolute; left:96px; right:96px; top:56px; display:flex; align-items:center; gap:24px; z-index:5; }
#topbar img{ height:56px; }
#topbar .tag{ font-family:var(--font-display); font-size:20px; letter-spacing:.3em; color:var(--gold); border:2px solid var(--gold);
  padding:6px 14px; border-radius:6px; }
#clock{ margin-left:auto; font-family:var(--font-display); font-size:40px; font-weight:600; letter-spacing:.06em; }

#heroCopy{ position:absolute; left:96px; top:250px; width:900px; z-index:5; }
#heroCopy h1{ font-family:var(--font-square); font-size:84px; line-height:1.02; color:var(--papad); font-weight:400; }
#heroCopy p{ margin-top:24px; font-size:30px; color:var(--text); line-height:1.4; max-width:780px; }

/* ---------- rows ---------- */
#rows{ position:absolute; left:0; right:0; top:560px; z-index:6; transition:transform .35s ease; }
.row{ height:440px; padding-left:96px; transition:opacity .3s; }
.row.above{ opacity:0; }
#heroVideo{ transition:opacity .4s; }
body.browsing #heroVideo{ opacity:.3; }
.row h2{ font-family:var(--font-display); font-size:28px; font-weight:600; letter-spacing:.08em; color:var(--text); margin-bottom:18px;
  opacity:.75; transition:opacity .2s; }
.row.active h2{ opacity:1; color:var(--gold-bright); }
.track{ display:flex; gap:32px; transition:transform .3s ease; height:380px; align-items:flex-start; padding-top:12px; }

.btn{ font-family:var(--font-display); font-size:28px; font-weight:700; letter-spacing:.06em; padding:22px 40px; border-radius:12px;
  background:rgba(36,51,76,.85); color:var(--text); border:3px solid transparent; white-space:nowrap; }
.btn.focus{ background:var(--papad); color:var(--on-accent); border-color:var(--papad); transform:scale(1.06); }

.card{ position:relative; flex:none; height:300px; border-radius:14px; overflow:hidden; background:var(--panel);
  border:4px solid transparent; transition:transform .2s ease, border-color .2s, box-shadow .2s; }
.card.land{ width:533px; }
.card.port{ width:169px; }
.card.news{ width:533px; }
.card img{ width:100%; height:100%; object-fit:cover; display:block; }
.card .label{ position:absolute; left:0; right:0; bottom:0; padding:48px 18px 14px; font-size:22px; font-weight:600; line-height:1.25;
  background:linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); opacity:0; transition:opacity .2s; }
.card.land .label{ opacity:1; }
/* news images are headline cards already: no overlay on top of them */
.card.news .label{ display:none; }
.card.focus{ transform:scale(1.08); border-color:var(--papad); box-shadow:0 18px 48px rgba(0,0,0,.6), 0 0 0 4px rgba(233,205,121,.25); z-index:2; }
.card.focus .label{ opacity:1; }
.card.port .label{ font-size:18px; padding:40px 10px 10px; }

#hint{ position:absolute; right:96px; top:128px; z-index:7; font-size:20px; color:var(--text-dim); letter-spacing:.04em; }
#hint b{ color:var(--text); border:2px solid var(--text-dim); border-radius:6px; padding:1px 8px; margin:0 4px; font-weight:600; }

/* ---------- full-screen player ---------- */
#player{ position:absolute; inset:0; background:#000; z-index:20; display:none; }
#player.open{ display:block; }
#player iframe, #player video{ position:absolute; inset:0; width:100%; height:100%; border:0; }
#playerTitle{ position:absolute; left:64px; top:48px; font-family:var(--font-display); font-size:30px; color:var(--text);
  text-shadow:0 2px 12px #000; transition:opacity .6s; pointer-events:none; }
#playerTitle small{ display:block; font-family:var(--font-body); font-size:22px; color:var(--text-dim); margin-top:8px; }

/* ---------- lobby / ambient mode ---------- */
#lobby{ position:absolute; inset:0; z-index:30; display:none; background:#000; }
#lobby.open{ display:block; }
#lobby video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; }
#lobbyClock{ position:absolute; left:110px; bottom:250px; font-family:var(--font-display); font-size:200px; font-weight:700; line-height:1; }
#lobbyDate{ position:absolute; left:116px; bottom:200px; font-size:36px; color:var(--papad); letter-spacing:.06em; }
#lobby img{ position:absolute; left:110px; top:90px; height:84px; }
#lobbyNews{ position:absolute; left:116px; right:116px; bottom:90px; font-size:30px; color:var(--text); transition:opacity .8s; }
#lobbyNews span{ color:var(--gold); font-family:var(--font-display); font-size:20px; letter-spacing:.2em; margin-right:18px; }
#lobbyContact{ position:absolute; right:110px; top:110px; font-family:var(--font-display); font-size:26px; color:var(--text-dim); }

#nomodule{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px; padding:80px; text-align:center; }
</style>
</head>
<body>
<div id="stage">
  <section id="hero">
    <video id="heroVideo" src="../assets/hero/reel-1080.mp4" poster="../assets/hero/reel-poster.webp" muted loop autoplay playsinline></video>
    <div id="topbar">
      <img src="../assets/logo-header.png" alt="Papad Pixels">
      <span class="tag">TV</span>
      <div id="clock"></div>
    </div>
    <div id="heroCopy">
      <h1>AI Films. Editing. Social Media.</h1>
      <p>AI video ads, TV commercials, UGC and social videos for brands worldwide.</p>
    </div>
  </section>

  <div id="rows"></div>
  <div id="hint"><b>&#9664;&#9650;&#9660;&#9654;</b> move <b>OK</b> play <b>BACK</b> close</div>

  <div id="player"><div id="playerTitle"></div></div>

  <div id="lobby">
    <video src="../assets/hero/reel-1080.mp4" poster="../assets/hero/reel-poster.webp" muted loop playsinline></video>
    <img src="../assets/logo-header.png" alt="">
    <div id="lobbyContact">create@papadpixels.com</div>
    <div id="lobbyClock"></div>
    <div id="lobbyDate"></div>
    <div id="lobbyNews"></div>
  </div>

  <script nomodule>document.getElementById('stage').innerHTML='<div id="nomodule">This TV browser is too old for Papad Pixels TV. Visit papadpixels.com/portfolio instead.</div>';</script>
</div>

<script type="module" src="tv.js?v=2"></script>
</body>
</html>
