name: Fetch video metadata (temporary)
on:
  push:
    branches: [claude/affectionate-noether-wv1fy1]
    paths: ['.github/workflows/fetch-video-meta.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch oEmbed metadata for every portfolio video
        run: |
          node --input-type=module -e '
          const { PROJECTS } = await import("./js/projects.js");
          const out = [];
          for (const p of PROJECTS) {
            const { type, id } = p.source;
            const url = type === "vimeo-video"
              ? `https://vimeo.com/api/oembed.json?url=${encodeURIComponent("https://vimeo.com/" + id)}`
              : `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent("https://www.youtube.com/watch?v=" + id)}`;
            try {
              const r = await fetch(url);
              const d = r.ok ? await r.json() : {};
              out.push({ id, cat: p.cat, status: r.status, title: d.title, width: d.width, height: d.height, thumb: d.thumbnail_url, upload: d.upload_date });
            } catch (e) { out.push({ id, error: String(e) }); }
          }
          console.log("META_JSON_START");
          console.log(JSON.stringify(out));
          console.log("META_JSON_END");
          '
